version: "3.9"

networks:
  default:
    name: web_net
services:
  db:
    image: docker.2mohsen.ir/database/postgres:14.1
    container_name: postgres
    environment:
      - POSTGRES_DB=devops
      - POSTGRES_USER=devops
      - POSTGRES_PASSWORD=devops
    volumes:
      - /pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: "docker.2mohsen.ir/database/rabbitmq:alpine"
    container_name: rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
  redis:
      image: "docker.2mohsen.ir/database/redis:7"
      container_name: redis 
      volumes:
      - redis-data:/data

  django:
    image: docker.2mohsen.ir/backend/backend:latest
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --no-input --clear &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
      #command: python manage.py runserver 0.0.0.0:8000
    environment:
      - DATABASE_URL=psql://devops:devops@db:5432/devops
      - REDIS_LOCATION=redis://redis:6379
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - SECRET_KEY=i5j5(f87^%ux__9f*&w$m@&u=sp^bhxj+26u-7na06z6egieuj
      - ALLOWED_HOSTS=api.2mohsen.ir
        #- SECURE_SSL_REDIRECT=false
    volumes:
      - static_volume:/app/backend/staticfiles
      - media_volume:/app/backend/media
      - ".:/app/backend/backend_api"
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_started
      traefik:
        condition: service_healthy
        
    restart: on-failure
    labels:
     - "traefik.enable=true"
     - "traefik.docker.network=web_net"
     - "traefik.http.routers.backend.entrypoints=http"
     - "traefik.http.routers.backend.rule=Host(`api.2mohsen.ir`)"
     - "traefik.http.routers.backend.service=backend-secure"
     - "traefik.http.routers.backend.middlewares=https-redirect"
     - "traefik.http.routers.backend-secure.entrypoints=https"
     - "traefik.http.routers.backend-secure.rule=Host(`api.2mohsen.ir`)"
     - "traefik.http.routers.backend-secure.tls=true"
     - "traefik.http.routers.backend-secure.tls.options=default"
     - "traefik.http.routers.backend-secure.tls.certresolver=mycert"
     - "traefik.http.routers.backend-secure.service=backend-secure"
     - "traefik.http.services.backend-secure.loadbalancer.server.port=8000"

volumes:
    redis-data:
    static_volume:
    media_volume:     

